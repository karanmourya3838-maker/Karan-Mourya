<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Army Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; background: #1a1a1a; font-family: Arial; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        #ui { position: absolute; top: 20px; left: 20px; color: #00ff00; font-size: 18px; background: rgba(0,0,0,0.9); padding: 15px 20px; border-radius: 8px; z-index: 100; border: 2px solid #00ff00; font-weight: bold; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 2px solid red; border-radius: 50%; pointer-events: none; z-index: 99; }
        #crosshairDot { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; background: red; border-radius: 50%; }
        #hitMarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 3px solid lime; display: none; pointer-events: none; z-index: 98; animation: flash 0.3s; }
        @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="ui">
        <div>🎖️ SCORE: <span id="score">0</span></div>
        <div>🔫 AMMO: <span id="ammo">30</span></div>
        <div>Click or SPACE to Shoot</div>
    </div>
    <div id="crosshair"><div id="crosshairDot"></div></div>
    <div id="hitMarker"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 1000, 2000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const groundGeom = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x2d5016 });
        const ground = new THREE.Mesh(groundGeom, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        let score = 0;
        let ammo = 30;
        let targets = [];

        const soldier = new THREE.Group();
        scene.add(soldier);

        const headGeom = new THREE.BoxGeometry(0.3, 0.4, 0.3);
        const skinMat = new THREE.MeshPhongMaterial({ color: 0xffd1a3 });
        const head = new THREE.Mesh(headGeom, skinMat);
        head.position.y = 1.7;
        head.castShadow = true;
        soldier.add(head);

        const helmetGeom = new THREE.ConeGeometry(0.2, 0.25, 8);
        const helmetMat = new THREE.MeshPhongMaterial({ color: 0x4a4a4a });
        const helmet = new THREE.Mesh(helmetGeom, helmetMat);
        helmet.position.y = 1.95;
        helmet.castShadow = true;
        soldier.add(helmet);

        const bodyGeom = new THREE.BoxGeometry(0.35, 0.6, 0.25);
        const uniformMat = new THREE.MeshPhongMaterial({ color: 0x2a5a2a });
        const body = new THREE.Mesh(bodyGeom, uniformMat);
        body.position.y = 1.2;
        body.castShadow = true;
        soldier.add(body);

        const leftArmGeom = new THREE.BoxGeometry(0.1, 0.5, 0.1);
        const armMat = new THREE.MeshPhongMaterial({ color: 0xffd1a3 });
        const leftArm = new THREE.Mesh(leftArmGeom, armMat);
        leftArm.position.set(-0.25, 1.35, 0);
        leftArm.rotation.z = Math.PI / 6;
        leftArm.castShadow = true;
        soldier.add(leftArm);

        const rightArm = new THREE.Mesh(leftArmGeom, armMat);
        rightArm.position.set(0.25, 1.35, 0);
        rightArm.rotation.z = -Math.PI / 6;
        rightArm.castShadow = true;
        soldier.add(rightArm);

        const legGeom = new THREE.BoxGeometry(0.1, 0.5, 0.1);
        const pantsMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
        const leftLeg = new THREE.Mesh(legGeom, pantsMat);
        leftLeg.position.set(-0.1, 0.5, 0);
        leftLeg.castShadow = true;
        soldier.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeom, pantsMat);
        rightLeg.position.set(0.1, 0.5, 0);
        rightLeg.castShadow = true;
        soldier.add(rightLeg);

        const gun = new THREE.Group();
        gun.position.set(0.2, 1.4, 0.3);

        const barrelGeom = new THREE.CylinderGeometry(0.015, 0.015, 0.6, 16);
        const gunMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
        const barrel = new THREE.Mesh(barrelGeom, gunMat);
        barrel.rotation.z = Math.PI / 2;
        barrel.position.z = 0.3;
        barrel.castShadow = true;
        gun.add(barrel);

        const stockGeom = new THREE.BoxGeometry(0.06, 0.05, 0.25);
        const stock = new THREE.Mesh(stockGeom, gunMat);
        stock.position.z = -0.1;
        stock.castShadow = true;
        gun.add(stock);

        const receiverGeom = new THREE.BoxGeometry(0.05, 0.04, 0.2);
        const receiver = new THREE.Mesh(receiverGeom, gunMat);
        receiver.position.z = 0.05;
        receiver.castShadow = true;
        gun.add(receiver);

        soldier.add(gun);

        function createTarget() {
            const targetGroup = new THREE.Group();

            const standGeom = new THREE.CylinderGeometry(0.15, 0.2, 2, 8);
            const standMat = new THREE.MeshPhongMaterial({ color: 0x8b7355 });
            const stand = new THREE.Mesh(standGeom, standMat);
            stand.position.y = 1;
            stand.castShadow = true;
            targetGroup.add(stand);

            const targetGeom = new THREE.CircleGeometry(0.3, 32);
            const targetMat = new THREE.MeshPhongMaterial({ color: 0xff0000 });
            const target = new THREE.Mesh(targetGeom, targetMat);
            target.position.set(0, 2, 0.05);
            target.receiveShadow = true;
            target.userData.isTarget = true;
            targetGroup.add(target);

            const centerGeom = new THREE.CircleGeometry(0.1, 32);
            const centerMat = new THREE.MeshPhongMaterial({ color: 0xffff00 });
            const center = new THREE.Mesh(centerGeom, centerMat);
            center.position.set(0, 2, 0.06);
            center.receiveShadow = true;
            targetGroup.add(center);

            targetGroup.position.x = (Math.random() - 0.5) * 15;
            targetGroup.position.z = Math.random() * 10 + 5;

            scene.add(targetGroup);
            return { group: targetGroup, hit: false };
        }

        for (let i = 0; i < 5; i++) {
            targets.push(createTarget());
        }

        function shoot() {
            if (ammo <= 0) return;

            ammo--;
            document.getElementById('ammo').textContent = ammo;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);

            targets.forEach(targetObj => {
                const circles = targetObj.group.children.filter(child => child.userData.isTarget);
                const intersects = raycaster.intersectObjects(circles);

                if (intersects.length > 0 && !targetObj.hit) {
                    targetObj.hit = true;
                    score += 10;
                    document.getElementById('score').textContent = score;

                    const hitMarker = document.getElementById('hitMarker');
                    hitMarker.style.display = 'block';
                    setTimeout(() => { hitMarker.style.display = 'none'; }, 300);

                    setTimeout(() => {
                        scene.remove(targetObj.group);
                        const idx = targets.indexOf(targetObj);
                        targets.splice(idx, 1);
                        targets.push(createTarget());
                    }, 500);
                }
            });
        }

        document.addEventListener('click', shoot);
        document.addEventListener('keypress', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                shoot();
            }
        });

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 2 - 1;
            const y = -(e.clientY / window.innerHeight) * 2 + 1;
            camera.rotation.y = x * 0.3;
            camera.rotation.x = y * 0.2;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
