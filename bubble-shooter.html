<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Shooter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 5/7;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
            border: 3px solid #333;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .score {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .score span {
            color: #667eea;
            font-size: 24px;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            z-index: 10;
        }

        .gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.98);
            color: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            display: none;
            pointer-events: auto;
            min-width: 280px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .gameover h1 {
            font-size: 50px;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .gameover p {
            font-size: 28px;
            margin: 20px 0;
            color: #fff;
        }

        .gameover button {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .gameover button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .gameover button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui">
            <div class="score">Score: <span id="scoreNum">0</span></div>
            <div class="info">🖱️ Move Mouse • Click to Shoot • Pop Bubbles!</div>
            <div class="gameover" id="gameOver">
                <h1>GAME OVER!</h1>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 500;
        canvas.height = 700;

        const game = {
            score: 0,
            gameOver: false,
            mouseX: canvas.width / 2,
            mouseY: 0
        };

        class Bubble {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;

                if (this.x - this.radius <= 0 || this.x + this.radius >= canvas.width) {
                    this.vx *= -0.9;
                    this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                }

                if (this.y - this.radius <= 0) {
                    this.vy *= -0.9;
                    this.y = this.radius;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                const gradient = ctx.createRadialGradient(
                    this.x - this.radius/3, 
                    this.y - this.radius/3, 
                    0,
                    this.x, 
                    this.y, 
                    this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.6)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            collidesWith(projectile) {
                const dx = this.x - projectile.x;
                const dy = this.y - projectile.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < this.radius + projectile.radius;
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.radius = 7;
                this.vx = Math.cos(angle) * 10;
                this.vy = Math.sin(angle) * 10;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
                    this.active = false;
                }
            }

            draw() {
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        class Cannon {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 50;
                this.angle = 0;
                this.barrelLength = 55;
                this.baseRadius = 30;
            }

            update(mouseX) {
                const dx = mouseX - this.x;
                const dy = 200 - this.y;
                this.angle = Math.atan2(dy, dx);
            }

            draw() {
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.baseRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();

                const endX = this.x + Math.cos(this.angle) * this.barrelLength;
                const endY = this.y + Math.sin(this.angle) * this.barrelLength;

                ctx.strokeStyle = '#555';
                ctx.lineWidth = 12;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.strokeStyle = '#999';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            shoot() {
                const startX = this.x + Math.cos(this.angle) * (this.baseRadius + 10);
                const startY = this.y + Math.sin(this.angle) * (this.baseRadius + 10);
                return new Projectile(startX, startY, this.angle);
            }
        }

        const cannon = new Cannon();
        let bubbles = [];
        let projectiles = [];

        function spawnBubbles(count) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA502', '#FF85A2', '#96CEB4'];
            for (let i = 0; i < count; i++) {
                const x = 60 + Math.random() * (canvas.width - 120);
                const y = 80 + Math.random() * 180;
                const color = colors[Math.floor(Math.random() * colors.length)];
                bubbles.push(new Bubble(x, y, 30, color));
            }
        }

        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            game.mouseX = e.clientX - rect.left;
            game.mouseY = e.clientY - rect.top;
        });

        document.addEventListener('click', () => {
            if (!game.gameOver) {
                projectiles.push(cannon.shoot());
            }
        });

        function updateScore(points) {
            game.score += points;
            document.getElementById('scoreNum').textContent = game.score;
        }

        function handleCollisions() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                for (let j = bubbles.length - 1; j >= 0; j--) {
                    if (bubbles[j].collidesWith(projectiles[i])) {
                        projectiles[i].active = false;
                        const bubble = bubbles[j];
                        bubbles.splice(j, 1);
                        updateScore(10);

                        if (bubble.radius > 18) {
                            for (let k = 0; k < 2; k++) {
                                const newBubble = new Bubble(
                                    bubble.x + (Math.random() - 0.5) * 40,
                                    bubble.y + (Math.random() - 0.5) * 40,
                                    bubble.radius - 10,
                                    bubble.color
                                );
                                bubbles.push(newBubble);
                            }
                        }
                        break;
                    }
                }
                if (!projectiles[i].active) {
                    projectiles.splice(i, 1);
                }
            }
        }

        function checkGameOver() {
            for (let bubble of bubbles) {
                if (bubble.y - bubble.radius > cannon.y - 60) {
                    return true;
                }
            }
            return false;
        }

        function gameLoop() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87ceeb');
            gradient.addColorStop(1, '#e0f6ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!game.gameOver) {
                cannon.update(game.mouseX);
                
                for (let bubble of bubbles) {
                    bubble.update();
                }
                
                for (let projectile of projectiles) {
                    projectile.update();
                }

                for (let bubble of bubbles) {
                    bubble.draw();
                }
                
                for (let projectile of projectiles) {
                    projectile.draw();
                }

                cannon.draw();

                handleCollisions();

                if (checkGameOver()) {
                    game.gameOver = true;
                    document.getElementById('finalScore').textContent = game.score;
                    document.getElementById('gameOver').style.display = 'block';
                }

                if (bubbles.length < 4) {
                    spawnBubbles(1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        spawnBubbles(6);
        gameLoop();
    </script>
</body>
</html>
