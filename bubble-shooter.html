<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Shooter Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 5/7;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
            border: 4px solid #333;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .score {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 20px;
            color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .score span {
            color: #667eea;
            font-size: 24px;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            z-index: 10;
        }

        .gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.98);
            color: white;
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            z-index: 100;
            display: none;
            pointer-events: auto;
            min-width: 280px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .gameover h1 {
            font-size: 50px;
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .gameover p {
            font-size: 28px;
            margin: 20px 0;
            color: #fff;
        }

        .gameover button {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .gameover button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .gameover button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui">
            <div class="score">Score: <span id="scoreNum">0</span></div>
            <div class="info">🖱️ Move Mouse • Click to Shoot</div>
            <div class="gameover" id="gameOver">
                <h1>GAME OVER!</h1>
                <p>Final Score: <span id="finalScore">0</span></p>
                <button onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 500;
        canvas.height = 700;

        const GAME_AREA_HEIGHT = 550; // Top area for bubbles
        const CANNON_AREA = canvas.height - GAME_AREA_HEIGHT;

        const game = {
            score: 0,
            gameOver: false,
            mouseX: canvas.width / 2,
        };

        class Bubble {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = Math.random() * 0.5 + 0.3; // Slow falling
                this.alive = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Keep bubbles in bounds horizontally
                if (this.x - this.radius < 0) {
                    this.vx = Math.abs(this.vx) * 0.8;
                    this.x = this.radius;
                }
                if (this.x + this.radius > canvas.width) {
                    this.vx = -Math.abs(this.vx) * 0.8;
                    this.x = canvas.width - this.radius;
                }

                // Keep bubbles in game area (don't go below)
                if (this.y + this.radius > GAME_AREA_HEIGHT) {
                    this.vy = 0;
                    this.y = GAME_AREA_HEIGHT - this.radius;
                }

                // Top bounce
                if (this.y - this.radius < 10) {
                    this.vy = Math.abs(this.vy) * 0.8;
                    this.y = 10 + this.radius;
                }
            }

            draw() {
                if (!this.alive) return;

                // Main bubble
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Border
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Shine effect
                const gradient = ctx.createRadialGradient(
                    this.x - this.radius/3, 
                    this.y - this.radius/3, 
                    0,
                    this.x, 
                    this.y, 
                    this.radius
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x - this.radius/3, this.y - this.radius/3, this.radius/2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            collidesWith(projectile) {
                if (!this.alive) return false;
                const dx = this.x - projectile.x;
                const dy = this.y - projectile.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < this.radius + projectile.radius;
            }

            pop() {
                this.alive = false;
                return true;
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.radius = 8;
                this.vx = Math.cos(angle) * 12;
                this.vy = Math.sin(angle) * 12;
                this.active = true;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Stop if out of bounds
                if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;

                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#FFA500';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Glow
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.5)';
                ctx.lineWidth = 5;
                ctx.stroke();
            }
        }

        class Cannon {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 30;
                this.angle = -Math.PI / 2;
                this.barrelLength = 50;
                this.baseRadius = 28;
            }

            update(mouseX) {
                const dx = mouseX - this.x;
                const dy = 100 - this.y;
                this.angle = Math.atan2(dy, dx);
                // Limit angle to shoot upwards only
                if (this.angle > 0) this.angle = 0;
                if (this.angle < -Math.PI) this.angle = -Math.PI;
            }

            draw() {
                // Base
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.baseRadius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Barrel
                const endX = this.x + Math.cos(this.angle) * this.barrelLength;
                const endY = this.y + Math.sin(this.angle) * this.barrelLength;

                ctx.strokeStyle = '#555';
                ctx.lineWidth = 14;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                ctx.strokeStyle = '#999';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }

            shoot() {
                const startX = this.x + Math.cos(this.angle) * (this.baseRadius + 5);
                const startY = this.y + Math.sin(this.angle) * (this.baseRadius + 5);
                return new Projectile(startX, startY, this.angle);
            }
        }

        const cannon = new Cannon();
        let bubbles = [];
        let projectiles = [];

        function spawnBubbles(count) {
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA502', '#FF85A2', '#96CEB4'];
            for (let i = 0; i < count; i++) {
                const x = 60 + Math.random() * (canvas.width - 120);
                const y = 50 + Math.random() * 150;
                const color = colors[Math.floor(Math.random() * colors.length)];
                bubbles.push(new Bubble(x, y, 25, color));
            }
        }

        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            game.mouseX = Math.max(0, Math.min(canvas.width, e.clientX - rect.left));
        });

        document.addEventListener('click', () => {
            if (!game.gameOver) {
                projectiles.push(cannon.shoot());
            }
        });

        function updateScore(points) {
            game.score += points;
            document.getElementById('scoreNum').textContent = game.score;
        }

        function handleCollisions() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (!projectiles[i].active) continue;

                for (let j = bubbles.length - 1; j >= 0; j--) {
                    if (bubbles[j].collidesWith(projectiles[i])) {
                        // Pop bubble
                        bubbles[j].pop();
                        projectiles[i].active = false;
                        updateScore(10);

                        // Remove dead bubbles and projectiles
                        bubbles = bubbles.filter(b => b.alive);
                        break;
                    }
                }
            }

            projectiles = projectiles.filter(p => p.active);
        }

        function checkGameOver() {
            // Game over when any bubble reaches the cannon area
            for (let bubble of bubbles) {
                if (bubble.alive && bubble.y + bubble.radius >= GAME_AREA_HEIGHT - 10) {
                    return true;
                }
            }
            return false;
        }

        function gameLoop() {
            // Draw background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87ceeb');
            gradient.addColorStop(0.7, '#e0f6ff');
            gradient.addColorStop(1, '#d0e8ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw separator line
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, GAME_AREA_HEIGHT);
            ctx.lineTo(canvas.width, GAME_AREA_HEIGHT);
            ctx.stroke();
            ctx.setLineDash([]);

            if (!game.gameOver) {
                // Update
                cannon.update(game.mouseX);
                
                for (let bubble of bubbles) {
                    bubble.update();
                }
                
                for (let projectile of projectiles) {
                    projectile.update();
                }

                // Draw
                for (let bubble of bubbles) {
                    bubble.draw();
                }
                
                for (let projectile of projectiles) {
                    projectile.draw();
                }

                cannon.draw();

                // Check
                handleCollisions();

                if (checkGameOver()) {
                    game.gameOver = true;
                    document.getElementById('finalScore').textContent = game.score;
                    document.getElementById('gameOver').style.display = 'block';
                }

                // Spawn more bubbles if needed
                if (bubbles.filter(b => b.alive).length < 5) {
                    spawnBubbles(1);
                }
            } else {
                // Draw cannon in game over state
                cannon.draw();
            }

            requestAnimationFrame(gameLoop);
        }

        spawnBubbles(6);
        gameLoop();
    </script>
</body>
</html>
